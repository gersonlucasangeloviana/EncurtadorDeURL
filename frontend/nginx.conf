set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

client_header_buffer_size 1k;
large_client_header_buffers 2 4k;

resolver 127.0.0.11 valid=5s ipv6=off;
upstream shortener_api {
  zone shortener_api 64k;
  server encurtador-api-interna:8000 resolve;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/m;
map $request_method $delete_limit_key { default ""; DELETE $binary_remote_addr; }
limit_req_zone $delete_limit_key zone=delete_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=redirect_per_ip:10m rate=20r/s;
limit_req_zone $hostname zone=panel_total:1m rate=20r/s;
limit_req_zone $hostname zone=redirect_total:1m rate=100r/s;
limit_req_status 429;

proxy_redirect off;

server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ {
    limit_req zone=api_per_ip burst=20 nodelay;
    limit_req zone=delete_per_ip burst=2 nodelay;
    limit_req zone=panel_total burst=60 nodelay;
    proxy_pass http://shortener_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-API-Key ${API_KEY};
  }
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 8080;
  location / {
    limit_req zone=redirect_per_ip burst=50 nodelay;
    limit_req zone=redirect_total burst=100 nodelay;
    proxy_pass http://shortener_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
